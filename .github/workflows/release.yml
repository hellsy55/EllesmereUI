name: Package and Release EllesmereUI

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release protection
        run: python3 -B .tools/tests/test_toc_policy.py

      - name: Validate the annotated tag, ancestry and source manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B .tools/release_manifest.py preflight --tag "$RELEASE_TAG" --remote

      - name: Install packaging dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion zip

      - name: Package, validate archives and publish
        run: bash .tools/release.sh --publish --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
