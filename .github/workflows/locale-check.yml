name: Locale keys up to date

# Anti-rot gate for the translation system: when source strings change, the
# committed EllesmereUILocales/_keys.txt must be regenerated so translators
# always see the current key list. This job fails the PR if it is stale.

on:
  pull_request:
    paths:
      - '**/*.lua'
      - 'EllesmereUILocales/_keys.txt'
      - '.tools/extract-locale-keys.sh'
      - '.tools/tests/test_locale_keys.py'
      - '.tools/tests/test_validation_workflows.py'
      - '.github/workflows/locale-check.yml'
  # Direct pushes also need verification on the maintained fork branches.
  push:
    branches: [main, new-features, 12.1.7-PTR-features]
    paths:
      - '**/*.lua'
      - 'EllesmereUILocales/_keys.txt'
      - '.tools/extract-locale-keys.sh'
      - '.tools/tests/test_locale_keys.py'
      - '.tools/tests/test_validation_workflows.py'
      - '.github/workflows/locale-check.yml'

permissions:
  contents: read

jobs:
  locale-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test locale extraction
        run: python3 -B .tools/tests/test_locale_keys.py

      - name: Verify locale keys without modifying files
        run: bash .tools/extract-locale-keys.sh --check
