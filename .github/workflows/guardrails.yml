name: Guardrails

# Mechanical checks for mistakes that kept landing on main. Same command as
# local: python3 .tools/guardrails.py --base <ref>. AGENTS.md lists the rule
# each check enforces; .tools/tests/test_guardrails.py tests the checks.

on:
  pull_request:
    paths:
      - '**.[lL][uU][aA]'
      - '**.[tT][oO][cC]'
      - '.tools/guardrails.py'
      - '.tools/lua_runtime.py'
      - '.tools/python_runtime.py'
      - '.tools/tests/test_guardrails.py'
      - '.tools/tests/test_maintenance.py'
      - '.tools/tests/test_validation_workflows.py'
      - '.github/workflows/guardrails.yml'
  push:
    branches: [main, new-features, 12.1.7-PTR-features]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Test the guardrails
        run: python3 -B .tools/tests/test_guardrails.py

      - name: Test the maintenance preflight
        run: python3 -B .tools/tests/test_maintenance.py

      - name: Test validation workflow contracts
        run: python3 -B .tools/tests/test_validation_workflows.py

      - name: Run guardrails
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPECTED_HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse --verify HEAD)
          printf 'Event: %s; forced: %s\nPrevious/base revision: %s\nExpected revision: %s\nChecked out revision: %s\n' \
            "$EVENT_NAME" "$FORCED" "$BASE" "$EXPECTED_HEAD" "$actual_head"
          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo '::error::Checkout differs from the event revision; validation is inconclusive.'
            exit 2
          fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo '::error::No previous/base revision (initial push); no baseline can be proved. No fallback is allowed.'
            exit 2
          fi
          if ! git rev-parse --verify "$BASE^{commit}"; then
            echo '::error::Previous/base commit is unavailable or Git failed; validation is inconclusive. Restore the required history.'
            exit 2
          fi
          # guardrails resolves and logs the common ancestor, failing on unrelated history.
          python3 -B .tools/guardrails.py --base "$BASE" --head "$actual_head"
