name: Packaging and Installer Tests

on:
  push:
    branches: [new-features, 12.1.7-PTR-features]
    paths: &packaging_paths
      - '.github/workflows/packaging-tests.yml'
      - '.github/workflows/release.yml'
      - '.pkgmeta'
      - '**.[tT][oO][cC]'
      - '.tools/toc_policy.json'
      - '.tools/install/**'
      - '.tools/audit_pkgmeta.py'
      - '.tools/build_portable_installers.py'
      - '.tools/normalize_tocs.py'
      - '.tools/release_manifest.py'
      - '.tools/check_lib_updates.py'
      - '.tools/release.sh'
      - '.tools/release.bat'
      - '.tools/tests/test_install_policy.ps1'
      - '.tools/tests/test_package_policy.ps1'
      - '.tools/tests/test_pkgmeta_audit.py'
      - '.tools/tests/test_portable_edges.ps1'
      - '.tools/tests/test_portable_packages.ps1'
      - '.tools/tests/test_toc_policy.py'
  pull_request:
    branches: [new-features, 12.1.7-PTR-features]
    paths: *packaging_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Verify test prerequisites
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'Windows PowerShell 5.1 is required.'
          }
          Get-Command git.exe, robocopy.exe, powershell.exe -ErrorAction Stop
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python is unavailable.' }

      - name: Parse production PowerShell scripts without executing them
        run: |
          $scripts = @(Get-ChildItem -LiteralPath .tools/install -Filter *.ps1 -Recurse -File)
          if (-not $scripts.Count) { throw 'No production PowerShell scripts found.' }
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "PowerShell syntax errors in $($script.FullName): $parseErrors" }
            Write-Host "PASS: $($script.Name)"
          }

      # Each suite owns disposable fixtures under the system temporary directory.
      - name: Test installation safety and recovery
        run: |
          ./.tools/tests/test_install_policy.ps1
          # The suite throws on failure; robocopy success codes can be nonzero.
          $global:LASTEXITCODE = 0

      - name: Test pkgmeta preparation and distribution manifests
        run: |
          ./.tools/tests/test_package_policy.ps1
          # Invoke-Robocopy already rejects codes >= 8 inside the suite.
          $global:LASTEXITCODE = 0

      - name: Test semantic pkgmeta audit and native Git previews
        run: python -B .tools/tests/test_pkgmeta_audit.py

      # test_toc_policy.py and event manifest checks remain in TOC compatibility.
      # Portable suites remain local: test_portable_edges.ps1 requires extracted
      # RetailDirectory and PtrDirectory containing the original portable scripts.
      # test_portable_packages.ps1 also requires RetailSnapshot, PtrSnapshot,
      # RetailPrepared and PtrPrepared. These artifacts are not versioned here;
      # generating replacement installers would not validate the real artifacts.
